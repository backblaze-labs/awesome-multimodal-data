  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.42" stop-color="#111827"/>
      <stop offset="1" stop-color="#191b22"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.24" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ff6242" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#ff6242" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6242" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.82" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#35e2d0" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#35e2d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#35e2d0" stop-opacity="0"/>
